// geschrieben nach: modules/core-download/android/build.gradle (lokales Expo-Modul) und modules/core-torrent/android/build.gradle (CMake, ABIs, 16-KB-Seiten)
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.seanime.coresodium'
version = '0.1.0'

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["x86", "x86_64", "armeabi-v7a", "arm64-v8a"]
}

android {
  namespace "com.seanime.coresodium"
  if (rootProject.ext.has("ndkVersion")) {
    ndkVersion rootProject.ext.get("ndkVersion")
  }
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles "consumer-rules.pro"
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=none", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters(*reactNativeArchitectures())
      }
    }
  }
  externalNativeBuild {
    cmake {
      path = file("CMakeLists.txt")
    }
  }
}
